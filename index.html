<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OPUS — Service Management Platform</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003366">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --z-overlay:400;--z-critical:2000;
  --sp-1:.25rem;--sp-2:.5rem;--sp-3:.75rem;--sp-4:1rem;--sp-6:1.5rem;--sp-8:2rem;--sp-10:2.5rem;--sp-12:3rem;--sp-16:4rem;
  --background:hsl(210,30%,97%);--foreground:hsl(213,60%,12%);
  --surface:#fff;--sidebar:hsl(213,62%,16%);--sidebar-foreground:hsl(210,40%,95%);
  --primary:hsl(213,100%,20%);--primary-foreground:#fff;
  --secondary:hsl(210,25%,92%);--accent:hsl(28,80%,39%);--accent-foreground:#fff;
  --muted:hsl(210,20%,94%);--muted-foreground:hsl(213,20%,42%);
  --success:hsl(152,55%,32%);--error:hsl(4,70%,45%);--warning:hsl(28,80%,39%);--info:hsl(199,89%,48%);
  --border:hsl(213,20%,85%);
  --font-base:'IBM Plex Sans',system-ui,sans-serif;--font-display:'Newsreader',Georgia,serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius-sm:.25rem;--radius:.375rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-full:9999px;
  --shadow:0 1px 2px hsla(213,60%,12%,.06);--shadow-md:0 2px 8px hsla(213,60%,12%,.1);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--background);}
body{font-family:var(--font-base);color:var(--foreground);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
a{color:var(--primary);text-decoration:none;}
h1,h2,h3{font-family:var(--font-display);margin:0;}
button,input,select,textarea{font-family:inherit;font-size:0.9375rem;}
.container{max-width:1120px;margin:0 auto;padding:0 var(--sp-6);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);padding:.65rem 1.15rem;border-radius:var(--radius);border:1px solid transparent;font-weight:600;cursor:pointer;font-size:.875rem;line-height:1;transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease;}
.btn-primary{background:linear-gradient(135deg,hsl(213,100%,24%),hsl(213,100%,16%));color:var(--primary-foreground);box-shadow:0 1px 2px hsla(213,60%,12%,.15),0 4px 14px hsla(213,100%,20%,.25);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 2px 4px hsla(213,60%,12%,.2),0 8px 20px hsla(213,100%,20%,.32);}
.btn-primary:active{transform:translateY(0);}
.btn-outline{background:#fff;border-color:var(--border);color:var(--foreground);}
.btn-outline:hover{background:var(--muted);border-color:hsl(213,20%,72%);}
.btn-ghost{background:transparent;color:inherit;}
.btn-ghost:hover{background:hsla(0,0%,100%,.08);}
.btn-destructive{background:var(--error);color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-sm{padding:.45rem .8rem;font-size:.8125rem;}
.btn-lg{padding:.85rem 1.75rem;font-size:1rem;}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=file],select,textarea{
  width:100%;padding:.65rem .85rem;border:1.5px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--foreground);
  transition:border-color .12s ease,box-shadow .12s ease;
}
input:hover,select:hover,textarea:hover{border-color:hsl(213,20%,70%);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px hsla(213,100%,20%,.12);}
label.field{display:flex;flex-direction:column;gap:var(--sp-2);font-size:.8125rem;font-weight:600;margin-bottom:var(--sp-4);letter-spacing:.01em;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-6);box-shadow:0 1px 2px hsla(213,60%,12%,.04),0 12px 32px -8px hsla(213,60%,12%,.08);}
.auth-split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;}
.auth-visual{position:relative;background:
    repeating-linear-gradient(0deg, transparent 0 27px, hsla(213,60%,20%,.5) 27px 28px),
    linear-gradient(160deg,hsl(213,62%,15%),hsl(213,72%,9%));
  overflow:hidden;display:flex;align-items:center;justify-content:center;padding:var(--sp-10);}
.auth-visual .visual-caption{position:relative;z-index:2;color:#fff;text-align:center;}
.auth-visual .visual-caption h2{font-size:1.5rem;line-height:1.3;margin:var(--sp-6) 0 var(--sp-2);}
.auth-visual .visual-caption p{color:hsla(0,0%,100%,.65);font-size:.9375rem;max-width:320px;margin:0 auto;}
@media(max-width:900px){.auth-split{grid-template-columns:1fr;}.auth-visual{display:none;}}
.auth-form-pane{display:flex;align-items:center;justify-content:center;padding:var(--sp-8);background:var(--background);}

/* Official seal — concentric rings with a rotating band of text, like an embossed government stamp */
.opus-seal{width:168px;height:168px;border-radius:50%;position:relative;margin:0 auto;
  background:radial-gradient(circle at 35% 30%, hsl(28,70%,46%), hsl(28,80%,32%) 60%, hsl(28,85%,24%) 100%);
  box-shadow:0 0 0 3px hsla(0,0%,100%,.15), 0 0 0 7px hsla(28,80%,39%,.25), 0 18px 40px -8px hsla(0,0%,0%,.5);
  display:flex;align-items:center;justify-content:center;}
.opus-seal::before{content:'';position:absolute;inset:14px;border-radius:50%;border:1.5px dashed hsla(0,0%,100%,.5);animation:seal-spin 40s linear infinite;}
.opus-seal .seal-core{width:104px;height:104px;border-radius:50%;background:hsl(213,62%,15%);border:2px solid hsla(0,0%,100%,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.opus-seal .seal-core .seal-mark{font-size:1.75rem;line-height:1;}
.opus-seal .seal-core .seal-label{font-family:var(--font-mono);font-size:.55rem;letter-spacing:.12em;color:hsla(0,0%,100%,.75);margin-top:.3rem;}
@keyframes seal-spin{to{transform:rotate(360deg);}}

/* Ledger-paper page background used on dashboards for a "registry" feel */
.ledger-bg{background:var(--background)
    repeating-linear-gradient(0deg, transparent 0 31px, hsla(213,30%,60%,.08) 31px 32px);}

/* Permit card: the physical-ID-card treatment for a Worker ID */
.permit-card{position:relative;background:linear-gradient(155deg,#fff,hsl(210,25%,97%));border:1px solid var(--border);
  border-radius:var(--radius-md);padding:var(--sp-6);box-shadow:0 1px 2px hsla(213,60%,12%,.06),0 16px 34px -14px hsla(213,60%,12%,.25);
  overflow:hidden;}
.permit-card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--primary),var(--accent));}
.permit-card .permit-eyebrow{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.12em;color:var(--muted-foreground);margin-bottom:var(--sp-1);}
.permit-card .permit-id{font-family:var(--font-mono);font-size:1.375rem;font-weight:600;color:var(--primary);letter-spacing:.03em;}
.permit-card .permit-seal{position:absolute;right:var(--sp-5);top:var(--sp-5);width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,hsl(28,70%,46%),hsl(28,85%,26%));display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:1.25rem;box-shadow:0 4px 12px hsla(28,80%,30%,.4);transform:rotate(-8deg);}

/* Ink stamp — the one deliberate motion moment, used for approved/completed/verified */
.ink-stamp{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .6rem;border-radius:3px;
  border:2px solid currentColor;color:var(--accent);font-family:var(--font-mono);font-size:.7rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;transform:rotate(-3deg);position:relative;}
.ink-stamp.stamp-navy{color:var(--primary);}
.ink-stamp.stamp-success{color:var(--success);}
@keyframes stamp-impact{0%{transform:rotate(-3deg) scale(2.4);opacity:0;}55%{transform:rotate(-3deg) scale(0.92);opacity:1;}75%{transform:rotate(-3deg) scale(1.06);}100%{transform:rotate(-3deg) scale(1);}}
.ink-stamp.stamp-animate{animation:stamp-impact .38s cubic-bezier(.2,.8,.3,1.1);}

.hero-permit-wrap{max-width:640px;margin:var(--sp-12) auto 0;display:flex;flex-direction:column;align-items:center;gap:var(--sp-6);}

/* Registry ledger table — used for admin's full detail views */
.ledger-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);}
table.ledger-table{width:100%;border-collapse:collapse;font-size:.8125rem;white-space:nowrap;}
table.ledger-table thead th{position:sticky;top:0;background:var(--sidebar);color:var(--sidebar-foreground);
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  text-align:left;padding:.65rem .85rem;border-bottom:2px solid var(--accent);}
table.ledger-table tbody td{padding:.65rem .85rem;border-bottom:1px solid var(--border);vertical-align:top;}
table.ledger-table tbody tr:last-child td{border-bottom:none;}
table.ledger-table tbody tr:hover{background:hsla(213,60%,90%,.25);}
table.ledger-table td .cell-primary{font-weight:600;color:var(--foreground);}
table.ledger-table td .cell-sub{color:var(--muted-foreground);font-size:.75rem;margin-top:2px;}
table.ledger-table td.col-id{font-family:var(--font-mono);color:var(--primary);font-weight:600;}
table.ledger-table td.col-workerid{font-family:var(--font-mono);color:var(--accent);font-weight:600;}

/* Notification bell */
.notif-badge{position:absolute;top:2px;right:2px;background:var(--error);color:#fff;font-size:.625rem;font-weight:700;
  min-width:16px;height:16px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;padding:0 3px;}
.notif-panel{position:absolute;top:60px;right:var(--sp-6);width:340px;max-width:90vw;background:#fff;border:1px solid var(--border);
  border-radius:var(--radius-md);box-shadow:var(--shadow-lg,0 8px 24px hsla(213,60%,12%,.2));z-index:var(--z-overlay);overflow:hidden;}
.notif-item{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border);cursor:pointer;}
.notif-item:hover{background:var(--muted);}
.notif-item:last-child{border-bottom:none;}
.notif-unread{background:hsla(199,89%,48%,.06);border-left:3px solid var(--info);}

/* Indian tricolor accents — used deliberately, not as random decoration */
:root{--tricolor-saffron:#FF9933;--tricolor-green:#138808;--tricolor-navy:#000080;}
.tricolor-strip{height:5px;background:linear-gradient(90deg,var(--tricolor-saffron) 0 33%,#fff 33% 67%,var(--tricolor-green) 67% 100%);}
.tricolor-tag{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;
  text-transform:uppercase;padding:.3rem .7rem;border-radius:var(--radius-full);
  background:linear-gradient(90deg,hsla(28,100%,57%,.14),hsla(0,0%,100%,.5),hsla(129,79%,27%,.14));
  border:1px solid hsla(213,20%,70%,.4);color:var(--foreground);}

/* 3D rotating Ashoka Chakra — pure CSS 3D transform, no WebGL. Genuine depth via perspective + rotateY. */
.chakra-stage{perspective:900px;display:flex;align-items:center;justify-content:center;}
.chakra-3d{width:132px;height:132px;position:relative;transform-style:preserve-3d;animation:chakra-spin 14s linear infinite;}
.chakra-face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 8%,#fff 8% 100%);
  border:5px solid var(--tricolor-navy);box-shadow:inset 0 0 0 2px hsla(240,100%,25%,.15),0 10px 26px -8px hsla(213,60%,12%,.3);
  display:flex;align-items:center;justify-content:center;}
.chakra-face::before{content:'';position:absolute;inset:8%;border-radius:50%;
  background:repeating-conic-gradient(var(--tricolor-navy) 0deg 7.5deg, transparent 7.5deg 15deg);
  -webkit-mask:radial-gradient(circle,transparent 22%,#000 23%);mask:radial-gradient(circle,transparent 22%,#000 23%);}
.chakra-face::after{content:'';position:absolute;inset:42%;border-radius:50%;background:var(--tricolor-navy);}
.chakra-back{transform:translateZ(-6px) rotateY(180deg);}
@keyframes chakra-spin{from{transform:rotateY(0deg);}to{transform:rotateY(360deg);}}
@media (prefers-reduced-motion: reduce){.chakra-3d{animation:none;}}

.empty-illustrated{text-align:center;padding:var(--sp-10) var(--sp-6);}
.empty-illustrated h3{font-family:var(--font-display);font-size:1.25rem;margin:var(--sp-5) 0 var(--sp-2);color:var(--foreground);}
.empty-illustrated p{color:var(--muted-foreground);font-size:.9375rem;max-width:380px;margin:0 auto var(--sp-5);line-height:1.6;}

/* Start OTP display (customer) and entry (worker) */
.otp-box{margin-top:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--radius);
  background:linear-gradient(135deg,hsla(28,80%,39%,.08),hsla(213,100%,20%,.06));border:1.5px dashed var(--accent);text-align:center;}
.otp-label{font-size:.7rem;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem;}
.otp-code{font-family:var(--font-mono);font-size:1.75rem;font-weight:700;letter-spacing:.25em;color:var(--primary);}
.otp-input{font-family:var(--font-mono);font-size:1.5rem;letter-spacing:.4em;text-align:center;}

/* Unmissable "worker marked complete" banner on the customer's card */
.complete-banner{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3);padding:var(--sp-3);
  border-radius:var(--radius);background:hsla(152,55%,32%,.1);border:1.5px solid var(--success);}
.complete-banner-icon{font-size:1.5rem;line-height:1;}
.complete-banner-title{font-weight:700;font-size:.875rem;color:var(--success);}
.complete-banner-sub{font-size:.75rem;color:var(--muted-foreground);}

/* Admin ops stats — fills space with something useful, not just decoration */
.admin-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);margin-top:var(--sp-8);}
.admin-stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--sp-5);text-align:center;}
.admin-stat-num{font-family:var(--font-mono);font-size:2rem;font-weight:700;color:var(--primary);}
.admin-stat-label{font-size:.75rem;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em;margin-top:.25rem;}
@media(max-width:700px){.admin-stats-row{grid-template-columns:1fr 1fr;}}

.skill-checks{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;}
.skill-check{display:flex;align-items:center;gap:.4rem;font-weight:400;font-size:.8125rem;cursor:pointer;}
.skill-check input{width:auto;}
.emergency-tag{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .55rem;border-radius:var(--radius-sm);
  background:var(--error);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;}
.match-list{display:flex;flex-direction:column;gap:var(--sp-2);}
.match-row{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-3);border:1.5px solid var(--border);
  border-radius:var(--radius);cursor:pointer;transition:border-color .12s;}
.match-row:hover{border-color:var(--primary);background:hsla(213,60%,90%,.2);}
.match-row.selected{border-color:var(--primary);background:hsla(213,100%,20%,.06);}
.match-row-name{font-weight:600;font-size:.875rem;}
.match-row-meta{display:flex;gap:var(--sp-3);font-size:.75rem;color:var(--muted-foreground);flex-wrap:wrap;margin-top:2px;}
.match-badge{font-family:var(--font-mono);font-size:.68rem;padding:.1rem .4rem;border-radius:3px;background:var(--muted);color:var(--muted-foreground);}
.match-badge.dist-near{background:hsla(152,55%,32%,.12);color:var(--success);}

.price-estimate-box{margin:-var(--sp-2) 0 var(--sp-4);padding:.5rem .75rem;background:hsla(28,80%,39%,.08);
  border-radius:var(--radius-sm);font-size:.8125rem;color:var(--foreground);}

.invoice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4);}
.invoice-row{display:flex;justify-content:space-between;gap:var(--sp-4);font-size:.8125rem;padding:.35rem 0;}
.invoice-row span:first-child{color:var(--muted-foreground);}
.invoice-divider{border-top:1px dashed var(--border);margin:var(--sp-2) 0;}
.invoice-total{font-size:1rem;}

/* Service tracking timeline — compact dot stepper */
.timeline-strip{display:flex;align-items:flex-start;margin-bottom:var(--sp-3);}
.timeline-step{flex:1;text-align:center;position:relative;}
.timeline-step::before{content:'';position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0;}
.timeline-step:first-child::before{display:none;}
.timeline-step.done::before, .timeline-step.active::before{background:var(--primary);}
.timeline-dot{width:11px;height:11px;border-radius:50%;background:var(--border);margin:0 auto;position:relative;z-index:1;}
.timeline-step.done .timeline-dot{background:var(--primary);}
.timeline-step.active .timeline-dot{background:var(--accent);box-shadow:0 0 0 3px hsla(28,80%,39%,.25);}
.timeline-label{font-size:.6rem;color:var(--muted-foreground);margin-top:3px;letter-spacing:.01em;}
.timeline-step.active .timeline-label{color:var(--accent);font-weight:600;}
.timeline-step.done .timeline-label{color:var(--primary);}

/* Demand forecast bars */
.forecast-section{margin-bottom:var(--sp-8);}
.forecast-section h3{font-family:var(--font-display);font-size:1rem;margin:0 0 var(--sp-3);}
.forecast-bar-row{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2);}
.forecast-bar-label{width:130px;font-size:.8125rem;flex-shrink:0;}
.forecast-bar-track{flex:1;height:16px;background:var(--muted);border-radius:var(--radius-full);overflow:hidden;}
.forecast-bar-fill{height:100%;background:var(--primary);border-radius:var(--radius-full);transition:width .4s ease;}
.forecast-bar-count{width:32px;text-align:right;font-family:var(--font-mono);font-size:.8125rem;color:var(--muted-foreground);}
.forecast-insight{background:hsla(28,80%,39%,.08);border:1px solid hsla(28,80%,39%,.3);border-radius:var(--radius);padding:var(--sp-4);font-size:.875rem;line-height:1.6;}
.lang-switcher{padding:.35rem .5rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:#fff;font-size:.75rem;}

/* Clean modern landing style — soft grey canvas, rounded white cards, pill nav */
.coreshift-page{background:hsl(220,20%,95%);min-height:100%;padding:var(--sp-8) var(--sp-6) var(--sp-16);}
.pill-nav{max-width:1040px;margin:0 auto var(--sp-8);}
.pill-nav-inner{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--radius-full);
  padding:.6rem .75rem .6rem 1.5rem;box-shadow:0 1px 2px hsla(0,0%,0%,.04),0 10px 24px -10px hsla(0,0%,0%,.1);flex-wrap:wrap;gap:var(--sp-3);}
.brand-mark{font-family:var(--font-display);font-weight:700;font-size:1.125rem;color:var(--foreground);}
.pill-nav-links{display:flex;align-items:center;gap:var(--sp-6);font-size:.875rem;font-weight:500;color:var(--foreground);}
.pill-nav-links a{color:var(--foreground);}
.pill-nav-signin{font-size:.875rem;font-weight:600;color:var(--foreground);padding:.6rem 1rem;}
.btn-black{display:inline-flex;align-items:center;gap:.4rem;background:#15181f;color:#fff;border-radius:var(--radius-full);
  padding:.6rem 1.35rem;font-weight:600;font-size:.875rem;text-decoration:none;transition:transform .12s,opacity .12s;}
.btn-black:hover{opacity:.88;transform:translateY(-1px);}

.hero-card{max-width:1040px;margin:0 auto;background:#fff;border-radius:32px;padding:var(--sp-16) var(--sp-8) var(--sp-12);
  text-align:center;box-shadow:0 1px 2px hsla(0,0%,0%,.04),0 30px 70px -30px hsla(0,0%,0%,.14);}
.hero-icon-badge{width:56px;height:56px;border-radius:16px;background:hsla(28,90%,60%,.14);display:flex;align-items:center;
  justify-content:center;font-size:1.625rem;margin:0 auto var(--sp-6);}
.hero-card-title{font-family:var(--font-base);font-weight:800;font-size:clamp(2rem,4.5vw,3rem);line-height:1.12;
  letter-spacing:-.01em;color:var(--foreground);max-width:680px;margin:0 auto var(--sp-4);}
.hero-card-sub{color:var(--muted-foreground);font-size:1.0625rem;max-width:560px;margin:0 auto var(--sp-8);line-height:1.6;}

.tile-row{display:flex;align-items:center;justify-content:center;gap:var(--sp-4);flex-wrap:wrap;margin-top:var(--sp-4);}
.service-tile{width:96px;height:96px;border-radius:22px;background:hsl(220,20%,96%);display:flex;flex-direction:column;

// Haversine distance in km between two lat/lng points — used for geo-based worker matching.
function distanceKm(lat1, lon1, lat2, lon2) {
  if ([lat1,lon1,lat2,lon2].some(v => v === null || v === undefined)) return null;
  const R = 6371, dLat = (lat2-lat1) * Math.PI/180, dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
// Best-effort browser geolocation; resolves { lat, lng } or null if denied/unavailable — never blocks the flow.
function captureLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve(null),
      { timeout: 6000 }
    );
  });
}

  if (status === 'cancelled') return `<div class="dim" style="font-size:.75rem;">Cancelled</div>`;
  let currentIdx = TIMELINE_STEPS.findIndex(s => s.key === status);
  if (status === 'payment_pending') currentIdx = TIMELINE_STEPS.findIndex(s => s.key === 'awaiting_confirmation');

// Best-effort push subscription capture. This does NOT make push delivery
// work end-to-end: actually sending a push needs a VAPID key pair and a
// server-side sender (e.g. a Supabase Edge Function) posting to each stored
// subscription — out of scope here. This wires up permission + subscription
// capture into `push_subscriptions` only, same "disclosed not faked" spirit
// as the Integration Roadmap doc.
async function enablePushSetup() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { toast('Push is not supported in this browser', true); return; }
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') { toast('Notification permission was not granted', true); return; }
    const reg = await navigator.serviceWorker.ready;
    // NOTE: no applicationServerKey (VAPID public key) is configured, so this
    // subscribe call will only succeed on browsers/setups that allow
    // subscribing without one. Real push delivery still requires a VAPID
    // key pair and a server-side sender — see opus-new-tables.sql.
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true });
    const { error } = await sb.from('push_subscriptions').insert({ user_id: state.session.user.id, subscription: sub.toJSON() });
    if (error) throw error;
    toast('Push subscription captured (delivery still needs a server-side sender)');
  } catch (err) { toast(err.message || 'Could not enable push', true); }
}

async function markNotifRead(id) {
  await sb.from('notifications').update({ is_read: true }).eq('id', id);
  const item = (window.__opusNotifications || []).find(n => n.id === id);
  if (item) item.is_read = true;
  renderNotifPanel();
  mountNotificationBell();
}

const SERVICE_TYPES = ['Plumbing','Electrical','Carpentry','Appliance Repair','Cleaning','Painting','Pest Control','AC Service'];

async function fetchCustomerRequests() {
  const { data: requests, error } = await sb.from('service_requests').select('*').order('created_at', { ascending: false });
  if (error) { toast(error.message, true); return []; }
  const ids = requests.map(r => r.id);
  const [{ data: assignments }, { data: payments }, { data: ratings }] = await Promise.all([
    ids.length ? sb.from('worker_assignments').select('*, profiles:worker_id(display_name)').in('service_request_id', ids).neq('status','cancelled') : { data: [] },
    ids.length ? sb.from('payments').select('*').in('service_request_id', ids) : { data: [] },
    ids.length ? sb.from('ratings').select('*').in('service_request_id', ids) : { data: [] },
  ]);
  const workerIds = [...new Set((assignments||[]).map(a=>a.worker_id))];
  let workerProfilesById = {};
  if (workerIds.length) {
    const { data: wps } = await sb.from('worker_profiles').select('user_id, worker_id').in('user_id', workerIds);
    (wps||[]).forEach(w => workerProfilesById[w.user_id] = w.worker_id);
  }
  return requests.map(r => {
    const a = (assignments||[]).find(x => x.service_request_id === r.id);
    const p = (payments||[]).find(x => x.service_request_id === r.id);
    const rt = (ratings||[]).find(x => x.service_request_id === r.id);
    return { ...r, assignment: a, workerName: a?.profiles?.display_name, workerOpusId: a ? workerProfilesById[a.worker_id] : null, payment: p, rating: rt };
  });
}

async function payForRequest(requestId, amount) {
  try {
    const { data: payment } = await sb.from('payments').select('*').eq('service_request_id', requestId).maybeSingle();
    if (!payment) throw new Error('Payment record not found');
    const { error: payErr } = await sb.from('payments').update({ status: 'completed', amount: amount || 499, paid_at: new Date().toISOString() }).eq('id', payment.id);
    if (payErr) throw payErr;
    const { error: reqErr } = await sb.from('service_requests').update({ status: 'payment_completed' }).eq('id', requestId);
    if (reqErr) throw reqErr;
    toast('Payment recorded');
    renderCustomer();
  } catch (err) { toast(err.message, true); }
}

let workerView = 'jobs';
async function renderWorkerEarnings(payments, doneAssignments, totalRevenue, jobsCompleted, avgRating) {
  // payments have no worker_id column — join back to the completed assignment's request.
  const byReq = {};
  doneAssignments.forEach(a => { byReq[a.service_requests.id] = a.service_requests; });
  const rows = payments.map(p => ({ ...p, request: byReq[p.service_request_id] })).filter(p => p.request)
    .sort((a,b) => new Date(b.paid_at) - new Date(a.paid_at));

  function periodKey(dateStr, granularity) {
    const d = new Date(dateStr);
    if (granularity === 'day') return d.toISOString().slice(0,10);
    if (granularity === 'month') return d.toLocaleString('en-IN', { month: 'short', year: 'numeric' });
    // week: ISO-ish week start (Sunday)
    const start = new Date(d); start.setDate(d.getDate() - d.getDay());
    return 'Week of ' + start.toISOString().slice(0,10);
  }
  function groupSums(granularity) {
    const map = {};
    rows.forEach(p => {
      const k = periodKey(p.paid_at, granularity);
      map[k] = map[k] || { count: 0, total: 0 };
      map[k].count++; map[k].total += Number(p.amount);
    });
    return Object.entries(map).sort((a,b) => a[0] < b[0] ? 1 : -1);
  }
  function breakdownTable(title, granularity) {
    const entries = groupSums(granularity);
    if (!entries.length) return `<h3 style="font-size:1rem;margin:var(--sp-6) 0 var(--sp-2);">${title}</h3>${illustratedEmpty('No payouts yet', 'Completed and paid jobs will show up here, grouped by period.')}`;
    return `
    <h3 style="font-size:1rem;margin:var(--sp-6) 0 var(--sp-2);">${title}</h3>
    <div class="ledger-table-wrap">
      <table class="ledger-table">
        <thead><tr><th>Period</th><th>Jobs Paid</th><th>Amount</th></tr></thead>
        <tbody>${entries.map(([k,v]) => `<tr><td class="cell-primary">${esc(k)}</td><td>${v.count}</td><td>₹${v.total.toFixed(0)}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
  }

  return `
  <div class="admin-stats-row" style="margin-top:0;margin-bottom:var(--sp-6);">
    <div class="admin-stat-card"><div class="admin-stat-num">₹${totalRevenue.toFixed(0)}</div><div class="admin-stat-label">Total Earnings</div></div>
    <div class="admin-stat-card"><div class="admin-stat-num">${jobsCompleted}</div><div class="admin-stat-label">Jobs Completed</div></div>
    <div class="admin-stat-card"><div class="admin-stat-num">${rows.length}</div><div class="admin-stat-label">Payouts Received</div></div>
    <div class="admin-stat-card"><div class="admin-stat-num">${avgRating === '—' ? avgRating : '★ ' + avgRating}</div><div class="admin-stat-label">Average Rating</div></div>
  </div>
  ${breakdownTable('By Day', 'day')}
  ${breakdownTable('By Week', 'week')}
  ${breakdownTable('By Month', 'month')}
  <h3 style="font-size:1rem;margin:var(--sp-6) 0 var(--sp-2);">Payout History</h3>
  ${rows.length === 0 ? illustratedEmpty('No payout history yet', 'Every completed and paid job will appear here with its date, request, service type and amount.') : `
  <div class="ledger-table-wrap">
    <table class="ledger-table">
      <thead><tr><th>Date</th><th>Request</th><th>Service Type</th><th>Amount</th></tr></thead>
      <tbody>${rows.map(p => `
        <tr>
          <td>${esc(fmtDate(p.paid_at))}</td>
          <td class="col-id">#OPUS-${String(p.request.id).padStart(5,'0')}</td>
          <td>${esc(p.request.service_type)}</td>
          <td>₹${Number(p.amount).toFixed(0)}</td>
        </tr>`).join('')}</tbody>
    </table>
  </div>`}
  `;
}

function renderWorkerCard(a) {

  const actionOnclick = a.status === 'accepted' ? `openStartOtpModal(${a.id})`

  document.getElementById('otp-error').innerHTML = '';
  if (!/^\d{6}$/.test(entered)) {
    document.getElementById('otp-error').innerHTML = `<div class="error-box">Enter the 6-digit code exactly as shown to the customer.</div>`;

async function transitionAssignment(assignmentId, toStatus) {
  try {
    const now = new Date().toISOString();
    const field = toStatus === 'accepted' ? 'accepted_at' : toStatus === 'in_progress' ? 'started_at' : 'completed_at';
    const { data: assignment, error: getErr } = await sb.from('worker_assignments').select('*, service_requests(*)').eq('id', assignmentId).single();
    if (getErr) throw getErr;
    const req = assignment.service_requests;
    const { error } = await sb.from('worker_assignments').update({ status: toStatus, [field]: now }).eq('id', assignmentId);
    if (error) throw error;
    await sb.from('service_requests').update({ status: REQUEST_STATUS_FOR_ASSIGNMENT[toStatus] }).eq('id', req.id);

    const workerName = state.profile?.display_name || 'Your worker';
    const notifs = [];
    if (toStatus === 'accepted') {
      notifs.push({ user_id: req.customer_id, recipient_role: 'customer', event_key: `worker_accepted:${assignmentId}`, title: 'Worker accepted your service', body: `${workerName} accepted your ${req.service_type} request and will begin soon.`, service_request_id: req.id });
    } else if (toStatus === 'in_progress') {
      notifs.push({ user_id: req.customer_id, recipient_role: 'customer', event_key: `work_started:${assignmentId}`, title: 'Work started', body: `${workerName} has started work on your ${req.service_type} request.`, service_request_id: req.id });
    } else if (toStatus === 'completed') {
      notifs.push({ user_id: req.customer_id, recipient_role: 'customer', event_key: `work_completed:${assignmentId}`, title: 'Work completed — please confirm', body: `${workerName} marked your ${req.service_type} request as complete. Please confirm to proceed to payment.`, service_request_id: req.id });
      const admins = (await sb.from('profiles').select('id').eq('role', 'admin')).data || [];
      admins.forEach(a => notifs.push({ user_id: a.id, recipient_role: 'admin', event_key: `admin_work_completed:${assignmentId}`, title: 'Work marked complete', body: `Request #${req.id} (${req.service_type}) marked complete by ${workerName}, awaiting customer confirmation.`, service_request_id: req.id }));
    }
    if (notifs.length) await sb.from('notifications').insert(notifs);

    toast('Status updated');
    renderWorker();
  } catch (err) { toast(err.message, true); }
}

async function viewProofPhoto(assignmentId) {

/* ============ RECURRING BOOKINGS (customer-managed, client-side "cron") ============ */
function advanceRecurringDate(dateStr, frequency) {
  const d = new Date(dateStr + 'T00:00:00');
  if (frequency === 'weekly') d.setDate(d.getDate() + 7);
  else if (frequency === 'biweekly') d.setDate(d.getDate() + 14);
  else if (frequency === 'monthly') d.setMonth(d.getMonth() + 1);
  return d.toISOString().slice(0, 10);
}
// Runs on every customer dashboard load: auto-creates a service_request for
// any active recurring booking whose next_run_date has arrived, then
// advances next_run_date. Guards against duplicates by checking for an
// existing service_request already linked to that recurring_booking today.
async function runRecurringBookings() {
  try {
    const todayStr = new Date().toISOString().slice(0, 10);
    const { data: due } = await sb.from('recurring_bookings').select('*')
      .eq('customer_id', state.session.user.id).eq('is_active', true).lte('next_run_date', todayStr);
    if (!due || !due.length) return;
    for (const rb of due) {
      const { data: existing } = await sb.from('service_requests').select('id')
        .eq('recurring_booking_id', rb.id).gte('created_at', todayStr + 'T00:00:00').maybeSingle();
      if (existing) { await sb.from('recurring_bookings').update({ next_run_date: advanceRecurringDate(rb.next_run_date, rb.frequency) }).eq('id', rb.id); continue; }
      const { data: newReq, error: insErr } = await sb.from('service_requests').insert({
        customer_id: rb.customer_id, service_type: rb.service_type, description: rb.description || null,
        address: rb.address, scheduled_date: rb.next_run_date, scheduled_time: rb.scheduled_time || '10:00',
        is_emergency: false, estimated_price: priceFor(rb.service_type)?.base_price ?? null,
        latitude: rb.latitude ?? null, longitude: rb.longitude ?? null, recurring_booking_id: rb.id,
      }).select().single();
      if (insErr || !newReq) continue;
      const nextRun = advanceRecurringDate(rb.next_run_date, rb.frequency);
      await sb.from('recurring_bookings').update({ next_run_date: nextRun }).eq('id', rb.id);
      await sb.from('notifications').insert({
        user_id: rb.customer_id, recipient_role: 'customer',
        event_key: `recurring_autobook:${rb.id}:${todayStr}`, title: 'Recurring booking auto-created',
        body: `Your recurring ${rb.service_type} booking was automatically scheduled for ${rb.next_run_date}.`,
        service_request_id: newReq.id,
      });
    }
  } catch (e) { /* best-effort — a failure here should never block the dashboard */ }
}

let chatChannel = null;
async function openChatModal(requestId) {
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-backdrop" onclick="if(event.target===this)closeChatModal()">
    <div class="modal modal-lg">
      <h2 style="font-size:1.25rem;margin-bottom:var(--sp-4);">Chat — Request #OPUS-${String(requestId).padStart(5,'0')}</h2>
      <div class="chat-panel">
        <div class="chat-messages" id="chat-messages"><div class="chat-empty">Loading…</div></div>
        <form class="chat-input-row" id="chat-form">
          <input type="text" id="chat-input" placeholder="Type a message…" autocomplete="off" required />
          <button type="submit" class="btn btn-primary btn-sm">Send</button>
        </form>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:var(--sp-3);">
        <button type="button" class="btn btn-outline btn-sm" onclick="closeChatModal()">Close</button>
      </div>
    </div>
  </div>`;
  await loadChatMessages(requestId);
  document.getElementById('chat-form').addEventListener('submit', (e) => { e.preventDefault(); sendChatMessage(requestId); });
  if (chatChannel) sb.removeChannel(chatChannel);
  chatChannel = sb.channel('chat-' + requestId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: `service_request_id=eq.${requestId}` }, () => loadChatMessages(requestId))
    .subscribe();
}
function closeChatModal() {
  if (chatChannel) { sb.removeChannel(chatChannel); chatChannel = null; }
  closeModal();
}
async function loadChatMessages(requestId) {
  const { data, error } = await sb.from('chat_messages').select('*').eq('service_request_id', requestId).order('created_at', { ascending: true });
  const box = document.getElementById('chat-messages');
  if (!box) return;
  if (error) { box.innerHTML = `<div class="chat-empty">${esc(error.message)}</div>`; return; }
  if (!data || !data.length) { box.innerHTML = `<div class="chat-empty">No messages yet — say hello.</div>`; return; }
  box.innerHTML = data.map(m => `
    <div class="chat-msg ${m.sender_id === state.session.user.id ? 'chat-msg-mine' : ''}">
      <div class="chat-msg-meta">${esc(m.sender_role)} · ${esc(fmtDate(m.created_at))}</div>
      ${esc(m.body)}
    </div>`).join('');
  box.scrollTop = box.scrollHeight;
}
async function sendChatMessage(requestId) {
  const input = document.getElementById('chat-input');
  const body = (input.value || '').trim();
  if (!body) return;
  input.value = '';
  try {
    const { error } = await sb.from('chat_messages').insert({
      service_request_id: requestId, sender_id: state.session.user.id, sender_role: state.profile.role, body,
    });
    if (error) throw error;
    await loadChatMessages(requestId);
    notifyChatRecipients(requestId, state.profile.role);
  } catch (err) { toast(err.message, true); }
}
async function notifyChatRecipients(requestId, senderRole) {
  try {
    const { data: r } = await sb.from('service_requests').select('customer_id').eq('id', requestId).single();
    const { data: assignment } = await sb.from('worker_assignments').select('worker_id').eq('service_request_id', requestId).neq('status', 'cancelled').maybeSingle();
    const notifs = [];
    const key = `chat_message:${requestId}:${Date.now()}`;
    if (senderRole !== 'customer' && r) notifs.push({ user_id: r.customer_id, recipient_role: 'customer', event_key: key, title: 'New chat message', body: `New message on request #${requestId}.`, service_request_id: requestId });
    if (senderRole !== 'worker' && assignment) notifs.push({ user_id: assignment.worker_id, recipient_role: 'worker', event_key: key, title: 'New chat message', body: `New message on request #${requestId}.`, service_request_id: requestId });
    if (senderRole !== 'admin') {
      const admins = (await sb.from('profiles').select('id').eq('role', 'admin')).data || [];
      admins.forEach(a => notifs.push({ user_id: a.id, recipient_role: 'admin', event_key: key, title: 'New chat message', body: `New message on request #${requestId}.`, service_request_id: requestId }));
    }
    if (notifs.length) await sb.from('notifications').insert(notifs);
  } catch (e) { /* best-effort — chat itself already succeeded */ }
}

function renderForecastTab(requests) {
  const byType = {};
  requests.forEach(r => { byType[r.service_type] = (byType[r.service_type]||0) + 1; });
  const sortedTypes = Object.entries(byType).sort((a,b) => b[1]-a[1]);
  const maxCount = sortedTypes[0]?.[1] || 1;

  const byDow = [0,0,0,0,0,0,0];
  requests.forEach(r => { byDow[new Date(r.scheduled_date).getDay()]++; });
  const dowLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const maxDow = Math.max(...byDow, 1);
  const busiestDow = dowLabels[byDow.indexOf(maxDow)];

  const topType = sortedTypes[0]?.[0];
  const topShare = sortedTypes[0] ? Math.round((sortedTypes[0][1] / requests.length) * 100) : 0;

  return `
  <div style="margin-bottom:var(--sp-2);">
    <p class="dim" style="font-size:.8125rem;margin-bottom:var(--sp-6);">Heuristic demand analysis from ${requests.length} historical requests — a statistical read of real booking data, not a predictive ML model. Useful as a workforce-allocation signal, not a guarantee.</p>
  </div>
  ${requests.length === 0 ? illustratedEmpty('Not enough data yet', 'Once bookings start coming in, this view will show which services are in highest demand and when — so you can allocate cooperative workers accordingly.') : `
  <div class="forecast-section">
    <h3>Demand by service type</h3>
    ${sortedTypes.map(([type,count]) => `
      <div class="forecast-bar-row">
        <span class="forecast-bar-label">${esc(type)}</span>
        <div class="forecast-bar-track"><div class="forecast-bar-fill" style="width:${(count/maxCount)*100}%;"></div></div>
        <span class="forecast-bar-count">${count}</span>
      </div>`).join('')}
  </div>
  <div class="forecast-section">
    <h3>Demand by day of week</h3>
    ${dowLabels.map((label,i) => `
      <div class="forecast-bar-row">
        <span class="forecast-bar-label">${label}</span>
        <div class="forecast-bar-track"><div class="forecast-bar-fill" style="width:${(byDow[i]/maxDow)*100}%;background:var(--accent);"></div></div>
        <span class="forecast-bar-count">${byDow[i]}</span>
      </div>`).join('')}
  </div>
  <div class="forecast-insight">
    💡 <strong>${esc(topType)}</strong> accounts for ${topShare}% of all requests — prioritize onboarding and verifying more ${esc(topType)}-skilled cooperative workers. <strong>${busiestDow}</strong> is your busiest day — ensure enough approved workers are marked "available" then.
  </div>`}
  `;
}

async function viewCertificate(path) {
  if (!path) { toast('No certificate on file', true); return; }
  const { data, error } = await sb.storage.from('rpl-certificates').createSignedUrl(path, 600);
  if (error) { toast(error.message, true); return; }
  window.open(data.signedUrl, '_blank', 'noopener,noreferrer');
}

function approveWithStamp(userId) {
  const row = document.getElementById('approval-actions-' + userId);
  if (row) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:hsla(0,0%,100%,.85);z-index:5;border-radius:inherit;';
    overlay.innerHTML = `<span class="ink-stamp stamp-navy stamp-animate" style="font-size:1rem;padding:.4rem 1rem;">✓ APPROVED</span>`;
    row.appendChild(overlay);
    setTimeout(() => reviewWorker(userId, 'approved'), 420);
  } else {
    reviewWorker(userId, 'approved');
  }
}

async function reviewWorker(userId, decision, reason) {
  try {
    const patch = decision === 'approved'
      ? { approval_status: 'approved', rpl_verification_status: 'verified', approved_at: new Date().toISOString(), approved_by: state.session.user.id }
      : { approval_status: 'rejected', rpl_verification_status: 'rejected', rejection_reason: reason || null };
    const { error } = await sb.from('worker_profiles').update(patch).eq('user_id', userId);
    if (error) throw error;
    const { data: wp } = await sb.from('worker_profiles').select('worker_id').eq('user_id', userId).maybeSingle();
    await sb.from('notifications').insert({
      user_id: userId, recipient_role: 'worker',
      event_key: decision === 'approved' ? `worker_approved:${userId}` : `worker_rejected:${userId}`,
      title: decision === 'approved' ? 'Account approved' : 'Registration not approved',
      body: decision === 'approved' ? `You're approved. Your Worker ID is ${wp?.worker_id}.` : (reason || 'Your registration was not approved.'),
    });
    toast('Worker review submitted');
    closeModal();
    renderAdminTabContent();
  } catch (err) { toast(err.message, true); }
}

      <h2 style="font-size:1.25rem;margin-bottom:var(--sp-4);">Reject worker registration</h2>
      <textarea id="reject-reason" rows="3" placeholder="Reason for rejection (optional)" style="margin-bottom:var(--sp-4);"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:var(--sp-2);">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-destructive" onclick="reviewWorker('${userId}','rejected', document.getElementById('reject-reason').value)">Confirm rejection</button>
      </div>
    </div>
  </div>`;
}

let selectedAssignWorkerId = null;

async function openAssignModal(requestId) {
  selectedAssignWorkerId = null;
  const { data: request } = await sb.from('service_requests').select('service_type, latitude, longitude').eq('id', requestId).single();
  const { data: eligible } = await sb.from('worker_profiles').select('user_id, worker_id, cooperative_societies(name), service_capabilities, latitude, longitude, profiles:user_id(display_name)').eq('approval_status','approved').eq('rpl_verification_status','verified');
  const { data: activeCounts } = await sb.from('worker_assignments').select('worker_id').in('status', ['assigned','accepted','in_progress']);
  const { data: allRatings } = await sb.from('ratings').select('worker_id, rating');
  const counts = {};
  (activeCounts||[]).forEach(a => counts[a.worker_id] = (counts[a.worker_id]||0)+1);
  const ratingByWorker = {};
  (allRatings||[]).forEach(r => {
    if (!ratingByWorker[r.worker_id]) ratingByWorker[r.worker_id] = { sum: 0, count: 0 };
    ratingByWorker[r.worker_id].sum += r.rating;
    ratingByWorker[r.worker_id].count += 1;
  });

  const ranked = (eligible||[]).map(w => {
    const skillMatch = (w.service_capabilities||[]).includes(request.service_type);
    const dist = distanceKm(request.latitude, request.longitude, w.latitude, w.longitude);
    const r = ratingByWorker[w.user_id];
    const avgRating = r ? (r.sum / r.count) : null;
    return { ...w, skillMatch, dist, avgRating, activeJobs: counts[w.user_id]||0 };
  }).sort((a,b) => {
    if (a.skillMatch !== b.skillMatch) return a.skillMatch ? -1 : 1;
    if (a.dist !== null && b.dist !== null) return a.dist - b.dist;
    if (a.dist !== null) return -1;
    if (b.dist !== null) return 1;
    return a.activeJobs - b.activeJobs;
  });

  document.getElementById('modal-root').innerHTML = `
  <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:480px;">
      <h2 style="font-size:1.25rem;margin-bottom:var(--sp-1);">Smart-matched workers</h2>
      <p class="dim" style="font-size:.8125rem;margin-bottom:var(--sp-4);">Ranked by skill match for <strong>${esc(request.service_type)}</strong>, then proximity, workload, and rating.</p>
      ${ranked.length===0 ? `<p class="dim">No approved, RPL-verified workers available.</p>` : `
        <div class="match-list">
          ${ranked.map((w,i) => `
          <div class="match-row" id="match-row-${w.user_id}" onclick="selectAssignWorker('${w.user_id}')">
            <div>
              <div class="match-row-name">${i+1}. ${esc(w.profiles.display_name)} <span class="dim mono" style="font-weight:400;font-size:.7rem;">${esc(w.worker_id)}</span></div>
              <div class="match-row-meta">
                <span class="match-badge ${w.skillMatch ? 'dist-near' : ''}">${w.skillMatch ? '✓ Skill match' : 'No listed skill match'}</span>
                ${w.dist !== null ? `<span class="match-badge ${w.dist < 5 ? 'dist-near' : ''}">${w.dist.toFixed(1)} km away</span>` : `<span class="match-badge">Distance unknown</span>`}
                <span class="match-badge">${w.avgRating ? '★ ' + w.avgRating.toFixed(1) : 'No ratings yet'}</span>
                <span class="match-badge">${w.activeJobs} active job${w.activeJobs===1?'':'s'}</span>
                ${w.cooperative_societies?.name ? `<span class="match-badge">${esc(w.cooperative_societies.name)}</span>` : ''}
              </div>
            </div>
          </div>`).join('')}
        </div>`}
      <div style="display:flex;justify-content:flex-end;gap:var(--sp-2);margin-top:var(--sp-5);">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="assign-confirm-btn" onclick="assignWorker(${requestId})">Confirm assignment</button>
      </div>
    </div>
  </div>`;
}

function selectAssignWorker(userId) {
  selectedAssignWorkerId = userId;
  document.querySelectorAll('.match-row').forEach(el => el.classList.remove('selected'));
  document.getElementById('match-row-' + userId)?.classList.add('selected');
}

async function assignWorker(requestId) {
  const workerId = selectedAssignWorkerId;
  if (!workerId) { toast('Select a worker first', true); return; }
  try {
    const { data: existing } = await sb.from('worker_assignments').select('*').eq('service_request_id', requestId).in('status', ['assigned','accepted','in_progress']).maybeSingle();
    if (existing && existing.worker_id !== workerId) {
      await sb.from('worker_assignments').update({ status: 'cancelled', cancelled_at: new Date().toISOString() }).eq('id', existing.id);
      await sb.from('notifications').insert({ user_id: existing.worker_id, recipient_role: 'worker', event_key: `assignment_cancelled:${existing.id}`, title: 'Assignment reassigned', body: `Your assignment for request #${requestId} was reassigned.`, service_request_id: requestId });
    } else if (existing && existing.worker_id === workerId) {
      toast('Worker already assigned'); closeModal(); return;
    }
    const { data: assignment, error } = await sb.from('worker_assignments').insert({ service_request_id: requestId, worker_id: workerId, assigned_by: state.session.user.id, status: 'assigned' }).select().single();
    if (error) throw error;
    const startOtp = String(Math.floor(100000 + Math.random() * 900000));
    await sb.from('worker_assignments').update({ start_otp: startOtp }).eq('id', assignment.id);
    await sb.from('service_requests').update({ status: 'worker_assigned' }).eq('id', requestId);
    const { data: req } = await sb.from('service_requests').select('*').eq('id', requestId).single();
    await sb.from('notifications').insert([
      { user_id: workerId, recipient_role: 'worker', event_key: `assignment_created:${assignment.id}`, title: 'New work assigned', body: `You have been assigned a ${req.service_type} request on ${fmtDate(req.scheduled_date)} at ${req.scheduled_time}, ${req.address}. Ask the customer for their Start OTP before beginning work.`, service_request_id: requestId },
      { user_id: req.customer_id, recipient_role: 'customer', event_key: `customer_worker_assigned:${assignment.id}`, title: 'Worker assigned to your service', body: `A worker has been assigned to your ${req.service_type} request. Your Start OTP is ${startOtp} — share it with the worker only when they arrive, so they can begin work.`, service_request_id: requestId },
    ]);
    toast('Worker assigned');
    closeModal();
    renderAdminTabContent();
  } catch (err) { toast(err.message, true); }
}

/* ============ ROUTE TABLE ============ */
async function render() {
  await Promise.all([loadProfile(), loadStaticData()]);
  const route = currentRoute();
  if (route === '/') return renderLanding();
  if (route === '/login') { if (state.session) return routeToDashboard(); return renderLogin(); }
  if (route === '/register/customer') { if (state.session) return routeToDashboard(); return renderRegisterCustomer(); }
  if (route === '/register/worker') { if (state.session) return routeToDashboard(); return renderRegisterWorker(); }
  if (route === '/customer') return renderCustomer();
  if (route === '/worker') return renderWorker();
  if (route === '/admin') return renderAdmin();
  navigate('/');
}
render();

// Register the PWA service worker (cache-first shell + push scaffolding).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* not fatal — app still works without it */ });
  });
}
</script>
</body>
